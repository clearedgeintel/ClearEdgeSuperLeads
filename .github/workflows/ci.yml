name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      # Unit tests only. The lifecycle.test.ts integration suite hits a real
      # Supabase DB (DATABASE_URL from .env) and does destructive cleanup, so it
      # runs locally/manually, not in CI. test:ci excludes it.
      - name: Test
        run: npm run test:ci
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build
